name: Deploy

on:
  push:
    branches: [main]

env:
  PROJECT_ID: project-033d1c03-5912-428c-8e1
  REGION: europe-west3
  SERVICE: budgex-api
  REPOSITORY: europe-west3-docker.pkg.dev/project-033d1c03-5912-428c-8e1/budgex

jobs:
  deploy:
    name: Deploy API to Cloud Run
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1033149277081/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@project-033d1c03-5912-428c-8e1.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE=${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}
          docker build -t "$IMAGE" backend
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image "$IMAGE" \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --quiet

      - name: Verify the new revision answers
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --region ${{ env.REGION }} --project ${{ env.PROJECT_ID }} \
            --format="value(status.url)")
          curl --fail --silent --show-error --max-time 60 "$URL/api/health"
