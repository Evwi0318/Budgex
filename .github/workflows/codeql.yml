name: CodeQL

# Statisk analys som letar efter injektion, osäker deserialisering och
# liknande klasser av fel. Körs på varje PR mot main, och en gång i veckan
# så att nyupptäckta mönster hittas i kod som redan ligger inne.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ["csharp", "javascript-typescript"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Build C#
        if: matrix.language == 'csharp'
        run: dotnet build backend/Budgex.sln --configuration Release

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
