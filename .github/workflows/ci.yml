name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore backend/Budgex.sln

      - name: Build
        run: dotnet build backend/Budgex.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/Budgex.sln --no-build --configuration Release

      # Bryter bygget när ett paket som faktiskt levereras får en känd
      # sårbarhet, så att vi får veta vid nästa PR i stället för när någon
      # råkar titta
      - name: Audit NuGet packages
        run: |
          dotnet list backend/Budgex.Api/Budgex.Api.csproj package --vulnerable --include-transitive 2>&1 | tee audit.txt
          if grep -q "has the following vulnerable packages" audit.txt; then
            echo "::error::Sårbara NuGet-paket i API:t"
            exit 1
          fi

      # Testberoenden paketeras aldrig, så de stoppar inte bygget — men de
      # ska synas, eftersom CI självt har åtkomst till hemligheter
      - name: Audit test dependencies
        continue-on-error: true
        run: dotnet list backend/Budgex.Tests/Budgex.Tests.csproj package --vulnerable --include-transitive

  frontend:
    name: Lint & Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Audit npm packages
        run: npm audit --audit-level=high
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Typecheck
        run: npx tsc -b --noEmit
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
